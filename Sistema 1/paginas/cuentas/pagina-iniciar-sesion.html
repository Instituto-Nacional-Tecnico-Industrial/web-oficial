<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | INTIWO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="../../iconos/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../css/variables-tema-diurno-nocturno.css">
  <link rel="stylesheet" href="../../css/layout-hamburguesa-y-overlay.css">
  <link rel="stylesheet" href="../../css/cuentas-acceso.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></symbol>
  </svg>
  <header class="intiwo-barra">
    <a href="pagina-cuentas.html" aria-label="Volver a Cuentas">
      <img class="intiwo-distintivo" src="../../iconos/marca-inti/Logotipo%20Barra-01.svg" alt="I.N.T.I.">
    </a>
    <div class="intiwo-barra-derecha">
      <button class="intiwo-interruptor-tema" type="button" data-intiwo-tema aria-label="Cambiar tema">
        <svg class="intiwo-tema-icon intiwo-tema-icon--sun" width="14" height="14"><use href="#i-sun"/></svg>
        <svg class="intiwo-tema-icon intiwo-tema-icon--moon" width="14" height="14"><use href="#i-moon"/></svg>
      </button>
    </div>
  </header>
  <main class="intiwo-cuentas-main">
    <section class="intiwo-cuentas-card" aria-labelledby="intiwo-login-titulo">
      <h1 id="intiwo-login-titulo">Iniciar sesión</h1>
      <p>Usa el correo con el que te dieron de alta y tu contraseña.</p>
      <form id="intiwo-form-login" class="intiwo-cuentas-form">
        <label class="intiwo-cuentas-campo">
          <span>Correo electrónico</span>
          <input type="email" name="email" autocomplete="username" required placeholder="19795194@inti.edu.sv">
          <p class="intiwo-cuentas-ayuda">Introduce tu correo institucional (@inti.edu.sv, @clases.edu.sv o el Gmail matriz).</p>
        </label>
        <label class="intiwo-cuentas-campo">
          <span>Contraseña</span>
          <span class="intiwo-cuentas-clave">
            <input id="intiwo-login-clave" type="password" name="password" autocomplete="current-password" required placeholder="TuClave*123">
            <button class="intiwo-cuentas-ojo" type="button" data-ojo-clave="intiwo-login-clave" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg><use href="#i-eye"/></svg>
            </button>
          </span>
          <p class="intiwo-cuentas-ayuda">La contraseña que elegiste al activar la cuenta.</p>
        </label>
        <button class="intiwo-cuentas-opcion" type="submit">Entrar</button>
      </form>
      <p class="intiwo-cuentas-mensaje" data-cuentas-mensaje aria-live="polite"></p>
      <a class="intiwo-cuentas-enlace" href="pagina-restablecer-contrasena.html">He olvidado mi contraseña</a>
      <a class="intiwo-cuentas-volver" href="pagina-cuentas.html">Volver a Cuentas</a>
    </section>
  </main>
  <script src="../../js/tema/persistir-tema-diurno-nocturno.js"></script>
  <script type="module" src="../../js/auth/pagina-iniciar-sesion.js"></script>
</body>
</html>
