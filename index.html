<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTI - Instituto Nacional Técnico Industrial</title>
  <link rel="stylesheet" href="style.css">
  <!-- SDK de Supabase desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Encabezado y Navegación Principal -->
  <header class="navbar">
    <div class="logo-container">
      <span class="logo-text">INTIWO</span>
    </div>

    <!-- Botón Menú Hamburguesa para Móviles -->
    <button class="hamburger-btn" id="hamburger-toggle" aria-label="Abrir menú">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Menú de Navegación -->
    <nav class="nav-links" id="nav-links">
      <a href="#inicio">Inicio</a>
      <a href="#especialidades">Especialidades</a>
      <a href="#noticias">Noticias</a>
      <a href="#contacto">Contacto</a>
      <button id="theme-toggle" class="btn-secondary">🌙 Modo Oscuro</button>
    </nav>
  </header>

  <!-- Contenedor Principal (Secciones dinámicas desde Supabase) -->
  <main>
    <section id="hero" class="hero-section">
      <h1 id="hero-title">Cargando sitio oficial...</h1>
      <p id="hero-subtitle">Conectando con la base de datos en tiempo real.</p>
    </section>

    <!-- Aquí se inyectarán las secciones dinámicas mediante JS -->
    <div id="dynamic-sections"></div>
  </main>

  <footer>
    <p>&copy; 2026 Instituto Nacional Técnico Industrial (INTI). Todos los derechos reservados.</p>
  </footer>

  <script src="supabase.js"></script>
</body>
</html>
